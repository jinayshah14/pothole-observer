<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pothole Observer · Pothole Observer ride data</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6fb; color: #0b1220; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
  .card { background: #fff; border-radius: 20px; box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 10px 30px rgba(16,24,40,.08); padding: 28px; max-width: 440px; width: 100%; display: grid; gap: 12px; }
  .logo { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #ff9f1c, #ff5f2e); display: grid; place-items: center; }
  h1 { font-size: 1.3rem; margin: 0; }
  p { margin: 0; color: #475467; }
  .spin { width: 22px; height: 22px; border: 3px solid #eef1f7; border-top-color: #ff5f2e; border-radius: 50%; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  a.btn { display: inline-block; background: #0b1220; color: #fff; text-decoration: none; padding: 10px 16px; border-radius: 10px; font-weight: 700; justify-self: start; }
  .tiny { font-size: .8rem; color: #8a94a6; }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<div class="card">
  <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 14h4l2-6 3 12 3-9 2 3h6"/></svg></div>
  <h1>Pothole Observer ride data</h1>
  <div id="state" style="display:flex;gap:10px;align-items:center"><div class="spin"></div><p>Finding the server's current address…</p></div>
  <p class="tiny">The Pothole Observer server runs on a laptop for now, so its address can change. This permanent link always forwards to the current one.</p>
</div>
<script>
(function () {
  var TARGET = "";                       // "setup" (app download) or "" (ride data)
  var q = new URLSearchParams(location.search), key = q.get("key");
  var state = document.getElementById("state");
  function fail(msg) { state.innerHTML = "<p>" + msg + "</p>"; }
  fetch("../link.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) {
      if (!j.url || !/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(j.url)) throw new Error("bad link");
      var dest = j.url + "/" + TARGET + (key ? "?key=" + encodeURIComponent(key) : "");
      state.innerHTML = '<a class="btn" href="' + dest.replace(/"/g, "&quot;") + '">Open the server</a><span class="tiny">Opening automatically…</span>';
      setTimeout(function () { location.replace(dest); }, 400);
    })
    .catch(function () { fail("Could not look up the server's address right now. Please try again in a minute."); });
})();
</script>
</body>
</html>
