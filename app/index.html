<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pothole Observer · Pothole Observer app download</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6fb; color: #0b1220; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
  .card { background: #fff; border-radius: 20px; box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 10px 30px rgba(16,24,40,.08); padding: 28px; max-width: 460px; width: 100%; display: grid; gap: 12px; }
  .logo { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #ff9f1c, #ff5f2e); display: grid; place-items: center; }
  h1 { font-size: 1.3rem; margin: 0; }
  p { margin: 0; color: #475467; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .spin { width: 22px; height: 22px; flex: none; border: 3px solid #eef1f7; border-top-color: #ff5f2e; border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  a.btn { display: inline-block; background: #0b1220; color: #fff; text-decoration: none; padding: 10px 16px; border-radius: 10px; font-weight: 700; }
  .note { background: #fff4de; color: #8a5a00; border-radius: 12px; padding: 10px 12px; font-size: .92rem; }
  .tiny { font-size: .8rem; color: #8a94a6; }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<div class="card">
  <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 14h4l2-6 3 12 3-9 2 3h6"/></svg></div>
  <h1>Pothole Observer app download</h1>
  <div id="state" class="row"><div class="spin"></div><p>Checking that the server is online…</p></div>
  <p class="tiny">The Pothole Observer server runs on a laptop for now, so its address can change. This permanent link always finds the current one.</p>
</div>
<script>
(function () {
  var TARGET = "setup";            // "setup" = app download page, "" = ride data
  var q = new URLSearchParams(location.search), key = q.get("key");
  var state = document.getElementById("state");
  function forward(url) {
    var dest = url + "/" + TARGET + (key ? "?key=" + encodeURIComponent(key) : "");
    state.innerHTML = '<a class="btn" href="' + dest.replace(/"/g, "&quot;") + '">Open the server</a><span class="tiny">Opening…</span>';
    location.replace(dest);
  }
  function offline() {
    if (TARGET === "") {
      state.innerHTML = '<div class="note">The live server is offline right now. Opening the latest saved map of all rides instead.</div><a class="btn" href="../#map">Open the saved map</a>';
      setTimeout(function () { location.replace("../#map"); }, 3500);
    } else {
      state.innerHTML = '<div class="note">The server is offline right now, so the app can’t be downloaded at this moment. Please try this same link again later; it works again as soon as the server is back.</div><a class="btn" href="../">See the project page</a>';
    }
  }
  fetch("../link.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) {
      if (!j.url || !/^https:\/\/[a-z0-9-]+\.(trycloudflare\.com|onrender\.com|duckdns\.org)$/.test(j.url)) throw new Error("bad link");
      // A free cloud server sleeps when unused and takes about a minute to wake: keep trying for up to 100 s.
      var t0 = Date.now(), done = false, budget = /onrender\.com$/.test(j.url) ? 100000 : 8000;  // only a cloud host sleeps
      var slow = setTimeout(function () { if (!done) state.innerHTML = '<div class="spin"></div><p>Waking up the server\u2026 this takes about a minute after a quiet spell.</p>'; }, 3000);
      (function attempt() {
        var img = new Image();
        img.onload = function () { if (!done) { done = true; clearTimeout(slow); forward(j.url); } };
        img.onerror = function () {
          if (done) return;
          if (Date.now() - t0 < budget) setTimeout(attempt, 4000); else { done = true; clearTimeout(slow); offline(); }
        };
        img.src = j.url + "/ping.svg?t=" + Date.now();
      })();
    })
    .catch(offline);
})();
</script>
</body>
</html>
